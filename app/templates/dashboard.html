{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1>Dashboard</h1>
        <p class="lead">Bienvenue sur votre tableau de bord</p>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-3">
        <div class="card text-white bg-primary">
            <div class="card-body">
                <h5 class="card-title">Clients</h5>
                <p class="card-text display-6">0</p>
                <a href="{{ url_for('clients') }}" class="text-white">Voir tous →</a>
            </div>
        </div>
    </div>
    
    <div class="col-md-3">
        <div class="card text-white bg-success">
            <div class="card-body">
                <h5 class="card-title">Projets</h5>
                <p class="card-text display-6">0</p>
                <a href="#" class="text-white">Voir tous →</a>
            </div>
        </div>
    </div>
    
    <div class="col-md-3">
        <div class="card text-white bg-warning">
            <div class="card-body">
                <h5 class="card-title">En retard</h5>
                <p class="card-text display-6">0</p>
                <a href="#" class="text-white">Voir détails →</a>
            </div>
        </div>
    </div>
    
    <div class="col-md-3">
        <div class="card text-white bg-info">
            <div class="card-body">
                <h5 class="card-title">Leads</h5>
                <p class="card-text display-6">0</p>
                <a href="#" class="text-white">Voir tous →</a>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5>Actions rapides</h5>
            </div>
            <div class="card-body">
                <a href="{{ url_for('new_client') }}" class="btn btn-primary me-2">Nouveau Client</a>
                <a href="{{ url_for('clients') }}" class="btn btn-outline-primary">Voir tous les clients</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
